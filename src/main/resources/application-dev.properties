# Dev profile: H2 in-memory with PostgreSQL compatibility mode.
# Used by tests and local dev without Docker.
spring.datasource.url=jdbc:h2:mem:shopwave;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Flyway run on H2 too (dev migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
